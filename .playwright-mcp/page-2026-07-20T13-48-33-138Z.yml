  - generic [ref=f14e21]:
    - heading "115學年度第1學期清華共學圈圈計畫申請表 Online Application for the Grant for NTHU Co-Learning Circle Program" [level=1] [ref=f14e22]
    - paragraph [ref=f14e24]: "申請截止日：請於115年7月27日（一）前完成填寫，方得申請本計畫；本表單須為召集人本人填寫，若內容有誤須由申請人自行承擔。 執行時間與核銷截止日：自核定日（預計115年9月初，實際日期請以核定通知信為準）起至115年11月16日(一)。 ※新系統上線說明：本學期已建置全新的申請系統，自即日起，所有申請一律請透過新系統進行填寫與送出，不再受理其他形式之申請方式，敬請同學配合。 由於新系統仍處於初期上線階段，為確保各位申請資料之完整保存，請同學務必自行另行留存所有申請內容作為備份。 其中，社群成員名單、活動規劃表及經費預算表，可參考附件表格自行留存（⚠️提醒：實際申請內容仍須完整填寫於系統中，附件僅作為自行備份使用）。 感謝同學在系統轉換期間的理解與配合，若操作上有任何問題，歡迎隨時與我們聯繫，我們也將持續優化系統使用體驗。 再次感謝大家的合作，祝申請順利！ 承辦人：教學發展中心鄭阡妤研究助理 分機：(03)571-5131 ext.35054 Email：chienyu@gapp.nthu.edu.tw Application Deadline ：Please complete the application by July 27, 2026 (Monday), starting from June 19, 2026 (Friday). Program Duration and Expense Verification Deadline :From the approval date (tentatively scheduled for early September 2026; the actual date shall be subject to the approval notification) until November 16, 2026 (Monday). Final Report Submission Deadline : December 21, 2026 (Monday). ※ Notice on the Launch of the New Application System:A brand-new application system has been launched this semester. Effective immediately, all applications must be completed and submitted exclusively through the new system. Applications submitted through other means will no longer be accepted. We kindly ask for your cooperation. As the system is still in its initial launch phase, students are strongly advised to keep personal backups of all submitted application materials to ensure proper record keeping. In particular, the list of community members, activity planning form, and budget proposal form may be saved using the attached templates for your own records (⚠️ Please note: all official application information must still be fully completed and submitted through the system. The attached files are for personal backup purposes only). Thank you for your understanding and cooperation during this transition period. Should you encounter any issues while using the system, please feel free to contact us. We will continue to optimize and improve the system’s user experience. Thank you again for your cooperation, and we wish you every success in your application! Please refer to the attached file for the system user manual. Organizer：Ms. Chien-Yu Cheng Extension Number：(03)571-5131ext.35054 Email：chienyu@gapp.nthu.edu.tw"
