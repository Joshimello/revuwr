name: Build and deploy production images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/joshimello/revuwr

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin
          - platform
    env:
      PUBLIC_ACME: ${{ vars.PUBLIC_ACME }}
      PUBLIC_BASE_PATH: ${{ matrix.app == 'admin' && vars.ADMIN_PUBLIC_BASE_PATH || vars.PLATFORM_PUBLIC_BASE_PATH }}
      PUBLIC_PB_URL: ${{ vars.PUBLIC_PB_URL }}
      PUBLIC_PLATFORM_URL: ${{ vars.PUBLIC_PLATFORM_URL }}
      PUBLIC_USER_BIRTHDAY: ${{ vars.PUBLIC_USER_BIRTHDAY || 'hide' }}
      PUBLIC_USER_COUNTRY: ${{ vars.PUBLIC_USER_COUNTRY || 'hide' }}
      PUBLIC_USER_DEPARTMENT: ${{ vars.PUBLIC_USER_DEPARTMENT || 'hide' }}
      PUBLIC_USER_OCCUPATION: ${{ vars.PUBLIC_USER_OCCUPATION || 'hide' }}
    steps:
      - name: Check required build configuration
        shell: bash
        run: |
          if [[ -z "$PUBLIC_PB_URL" ]]; then
            echo "::error::Set the PUBLIC_PB_URL repository variable."
            exit 1
          fi

          if [[ "$APP" == "admin" && -z "$PUBLIC_PLATFORM_URL" ]]; then
            echo "::error::Set the PUBLIC_PLATFORM_URL repository variable."
            exit 1
          fi

          if [[ "$APP" == "platform" && -z "$PUBLIC_ACME" ]]; then
            echo "::error::Set the PUBLIC_ACME repository variable."
            exit 1
          fi
        env:
          APP: ${{ matrix.app }}

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            APP=${{ matrix.app }}
            PUBLIC_ACME=${{ env.PUBLIC_ACME }}
            PUBLIC_BASE_PATH=${{ env.PUBLIC_BASE_PATH }}
            PUBLIC_PB_URL=${{ env.PUBLIC_PB_URL }}
            PUBLIC_PLATFORM_URL=${{ env.PUBLIC_PLATFORM_URL }}
            PUBLIC_USER_BIRTHDAY=${{ env.PUBLIC_USER_BIRTHDAY }}
            PUBLIC_USER_COUNTRY=${{ env.PUBLIC_USER_COUNTRY }}
            PUBLIC_USER_DEPARTMENT=${{ env.PUBLIC_USER_DEPARTMENT }}
            PUBLIC_USER_OCCUPATION=${{ env.PUBLIC_USER_OCCUPATION }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:main
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:sha-${{ github.sha }}

  deploy:
    name: Deploy through Coolify
    needs:
      - build
    runs-on: ubuntu-latest
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
    steps:
      - name: Trigger Coolify deployment
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_WEBHOOK != '' }}
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request GET \
            "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Report missing Coolify configuration
        if: ${{ env.COOLIFY_TOKEN == '' || env.COOLIFY_WEBHOOK == '' }}
        run: echo "::notice::Images were published, but deployment was skipped because COOLIFY_TOKEN or COOLIFY_WEBHOOK is not configured."
